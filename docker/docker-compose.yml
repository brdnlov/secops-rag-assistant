services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: secops-qdrant
    ports:
      - "6333:6333"   # REST + gRPC (hybrid queries, BM25 inference)
      - "6334:6334"   # internal gRPC (optional; unused by the client)
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage: